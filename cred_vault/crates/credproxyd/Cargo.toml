[package]
name = "credproxyd"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
uuid = { version = "1.29.0", features = ["v7"] }
webpki-roots = "0.26"

[features]
# Test-only hooks that must not exist in a release build. Integration
# tests run the daemon binary with `--features test-hooks` and pass
# `--lock-file` so they never touch `/run/credproxy`.
test-hooks = []

[dev-dependencies]
credstore = { path = "../credstore" }
tempfile = "3"
