<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgentMoss 安全策略管控台</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
/* ===== OpenDesk --ag- design tokens（浅色玻璃态 + dark mode）===== */
:root {
  --ag-bg: #f5f5f7;
  --ag-card-bg: rgba(255,255,255,.72);
  --ag-card-border: rgba(255,255,255,.5);
  --ag-text: #1d1d1f;
  --ag-text-secondary: #6e6e73;
  --ag-text-tertiary: #aeaeb2;
  --ag-text-heading: #1d1d1f;
  --ag-accent: #007AFF;
  --ag-accent-hover: #005EC4;
  --ag-red: #FF3B30;
  --ag-green: #34C759;
  --ag-orange: #FF9500;
  --ag-purple: #AF52DE;
  --ag-teal: #5AC8FA;
  --ag-yellow: #FFCC00;
  --ag-input-bg: rgba(255,255,255,.6);
  --ag-input-border: rgba(0,0,0,.08);
  --ag-input-focus-ring: rgba(0,122,255,.3);
  --ag-divider: rgba(0,0,0,.06);
  --ag-code-bg: rgba(0,0,0,.04);
  --ag-danger-bg: rgba(255,59,48,.06);
  --ag-danger-border: rgba(255,59,48,.18);
  --ag-tab-active-border: #007AFF;
  --ag-tab-inactive: #aeaeb2;
  --ag-badge-deny-bg: rgba(255,59,48,.12);
  --ag-badge-allow-bg: rgba(52,199,89,.12);
}
[data-theme="dark"] {
  --ag-bg: #1c1c1e;
  --ag-card-bg: rgba(44,44,46,.75);
  --ag-card-border: rgba(255,255,255,.08);
  --ag-text: #e5e5e7;
  --ag-text-secondary: #98989d;
  --ag-text-tertiary: #636366;
  --ag-text-heading: #e5e5e7;
  --ag-accent: #0A84FF;
  --ag-accent-hover: #409CFF;
  --ag-input-bg: rgba(255,255,255,.08);
  --ag-input-border: rgba(255,255,255,.1);
  --ag-input-focus-ring: rgba(10,132,255,.35);
  --ag-divider: rgba(255,255,255,.08);
  --ag-code-bg: rgba(255,255,255,.06);
  --ag-danger-bg: rgba(255,69,58,.12);
  --ag-badge-deny-bg: rgba(255,69,58,.18);
  --ag-badge-allow-bg: rgba(48,209,88,.18);
  --ag-tab-active-border: #0A84FF;
  --ag-tab-inactive: #636366;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--ag-bg); color: var(--ag-text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  -webkit-font-smoothing: antialiased; font-size: 14px;
}
.ag-wrap { display: flex; flex-direction: column; min-height: 100vh; }
.ag-tabs { display: flex; align-items: flex-end; border-bottom: 1px solid var(--ag-divider); padding: 20px 20px 0; gap: 4px; }
.ag-tab { padding: 8px 16px 7px; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; user-select: none; color: var(--ag-tab-inactive); transition: color .2s; }
.ag-tab:hover { color: var(--ag-text); }
.ag-tab.active { color: var(--ag-accent); border-bottom-color: var(--ag-tab-active-border); }
.ag-tab-spacer { flex: 1; }
.ag-theme-btn { padding: 6px 12px; font-size: 12px; cursor: pointer; background: var(--ag-input-bg); border: 1px solid var(--ag-input-border); border-radius: 8px; color: var(--ag-text-secondary); }
.ag-panel { flex: 1; overflow: auto; padding: 20px; max-width: 1100px; margin: 0 auto; width: 100%; }
.ag-panel.hidden { display: none; }
.ag-card { background: var(--ag-card-bg); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-radius: 14px; border: 1px solid var(--ag-card-border); box-shadow: 0 2px 8px rgba(0,0,0,.04); padding: 16px; margin-bottom: 16px; }
.ag-section-title { font-size: 13px; font-weight: 600; color: var(--ag-text-heading); margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
.ag-section-title::before { content: ''; display: block; width: 3px; height: 14px; background: var(--ag-accent); border-radius: 2px; }
.ag-section-desc { font-size: 12px; color: var(--ag-text-secondary); line-height: 1.5; margin: 0 0 14px; }
.ag-label { display: block; font-size: 12px; font-weight: 500; color: var(--ag-text-secondary); margin-bottom: 6px; }
.ag-input, .ag-select, textarea.ag-input { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid var(--ag-input-border); border-radius: 8px; background: var(--ag-input-bg); color: var(--ag-text); outline: none; transition: border-color .2s, box-shadow .2s; -webkit-appearance: none; font-family: inherit; }
.ag-input:focus, .ag-select:focus { border-color: var(--ag-accent); box-shadow: 0 0 0 3px var(--ag-input-focus-ring); }

/* Toggle */
.ag-toggle { position: relative; width: 42px; height: 24px; border-radius: 12px; border: none; background: #d1d5db; cursor: pointer; transition: background .22s ease; padding: 0; flex-shrink: 0; }
[data-theme="dark"] .ag-toggle { background: #48484a; }
.ag-toggle.on { background: var(--ag-accent); }
.ag-toggle.disabled { opacity: .4; cursor: not-allowed; }
.ag-toggle-knob { position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); transition: transform .22s ease; }
.ag-toggle.on .ag-toggle-knob { transform: translateX(18px); }
.ag-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ag-toggle-row-label { font-size: 13px; font-weight: 500; color: var(--ag-text); }
.ag-toggle-row-desc { font-size: 11px; color: var(--ag-text-tertiary); margin-top: 2px; }
.ag-env-badge { font-size: 10px; color: var(--ag-orange); margin-left: 8px; }
.ag-env-override-badge { background: var(--ag-red); color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 4px; margin-top: 4px; display: inline-block; }

/* 按钮 */
.ag-btn { display: inline-flex; align-items: center; padding: 6px 14px; font-size: 12px; font-weight: 500; border-radius: 8px; cursor: pointer; transition: all .2s; border: none; gap: 6px; }
.ag-btn-primary { background: var(--ag-accent); color: #fff; }
.ag-btn-primary:hover { background: var(--ag-accent-hover); }
.ag-btn-ghost { background: transparent; color: var(--ag-accent); border: 1px solid var(--ag-accent); }
.ag-btn-danger { background: transparent; color: var(--ag-red); border: 1px solid var(--ag-red); }
.ag-btn-danger:hover { background: var(--ag-danger-bg); }
.ag-btn-sm { padding: 4px 10px; font-size: 11px; border-radius: 6px; }
.ag-btn-sm.active { background: var(--ag-accent); color: #fff; border: 1px solid var(--ag-accent); }

/* 分类可折叠 + 大类总开关 */
.ag-cat-header { display: flex; align-items: center; justify-content: space-between; cursor: pointer; padding: 4px 0 8px; border-bottom: 1px solid var(--ag-divider); }
.ag-cat-name { font-size: 13px; font-weight: 600; color: var(--ag-text-heading); display: flex; align-items: center; gap: 8px; }
.ag-cat-count { font-size: 11px; color: var(--ag-text-secondary); background: var(--ag-code-bg); padding: 1px 8px; border-radius: 10px; }
.ag-cat-controls { display: flex; align-items: center; gap: 12px; }
.ag-expand-icon { font-size: 12px; color: var(--ag-text-tertiary); transition: transform .2s; display: inline-block; }
.ag-expand-icon.open { transform: rotate(180deg); }
.ag-rule-list { padding: 6px 0; }

/* 规则项卡片化 */
.ag-rule-item { display: flex; align-items: flex-start; gap: 12px; padding: 10px 12px; margin: 6px 0; font-size: 13px; border: 1px solid var(--ag-divider); border-radius: 8px; background: var(--ag-card-bg); transition: border-color .15s, box-shadow .15s; }
.ag-rule-item:hover { border-color: var(--ag-accent); box-shadow: 0 2px 8px rgba(0,122,255,.08); }
.ag-rule-body { flex: 1; min-width: 0; }
.ag-rule-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.ag-rule-pattern { font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; color: var(--ag-text); word-break: break-all; line-height: 1.5; }
.ag-rule-reason { font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; color: var(--ag-text-secondary); word-break: break-all; line-height: 1.5; margin-top: 3px; }
.ag-rule-field-label { color: var(--ag-text-heading); font-family: inherit; margin-right: 2px; }
.ag-rule-id { color: var(--ag-text-tertiary); font-size: 11px; font-family: monospace; margin-top: 3px; }
.ag-rule-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

/* Badge */
.ag-badge { display: inline-block; min-width: 48px; text-align: center; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; line-height: 1.4; }
.ag-badge-critical { background: var(--ag-badge-deny-bg); color: var(--ag-red); }
.ag-badge-high { background: rgba(255,149,0,.12); color: var(--ag-orange); }
.ag-badge-medium, .ag-badge-low { background: var(--ag-code-bg); color: var(--ag-text-secondary); }
.ag-badge-allow { background: var(--ag-badge-allow-bg); color: var(--ag-green); }
.ag-badge-deny { background: var(--ag-badge-deny-bg); color: var(--ag-red); }
.ag-badge-builtin { background: var(--ag-code-bg); color: var(--ag-text-secondary); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.ag-badge-custom { background: rgba(0,122,255,.12); color: var(--ag-accent); font-size: 10px; padding: 1px 6px; border-radius: 3px; }
.ag-badge-removed { background: rgba(255,149,0,.12); color: var(--ag-orange); font-size: 10px; padding: 1px 6px; border-radius: 3px; border: 1px solid rgba(255,149,0,.3); }

/* 风险类型标签（左边框彩色） */
.ag-risk-type { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; border-left: 3px solid; background: var(--ag-code-bg); color: var(--ag-text); }
.ag-risk-type::before { content: "🏷 "; opacity: 0.7; }
.ag-rt-script_execution { border-left-color: #6366f1; }
.ag-rt-file_access { border-left-color: #0ea5e9; }
.ag-rt-data_exfiltration { border-left-color: #f59e0b; }
.ag-rt-privilege_escalation { border-left-color: #dc2626; }
.ag-rt-persistence { border-left-color: #7c3aed; }
.ag-rt-lateral_movement { border-left-color: #db2777; }
.ag-rt-config_tampering { border-left-color: #ea580c; }
.ag-rt-supply_chain { border-left-color: #16a34a; }
.ag-rt-resource_exhaustion { border-left-color: #0891b2; }
.ag-rt-intent_deviation { border-left-color: #9333ea; }

/* deny_mode badge 三色 */
.ag-deny-mode { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; }
.ag-deny-mode.deny-both { background: rgba(175,82,222,.12); color: var(--ag-purple); }
.ag-deny-mode.deny-write { background: rgba(52,199,89,.12); color: var(--ag-green); }
.ag-deny-mode.deny-read { background: rgba(255,149,0,.12); color: var(--ag-orange); }
.ag-source-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; background: rgba(10,132,255,.08); color: var(--ag-accent); font-weight: 500; }
.ag-overridden-hint { font-size: 10px; color: var(--ag-red); font-weight: 500; }

/* deny_mode select */
.ag-deny-select { font-size: 11px; padding: 2px 4px; border: 1px solid var(--ag-input-border); border-radius: 4px; background: var(--ag-input-bg); color: var(--ag-text); cursor: pointer; max-width: 100px; }
.ag-deny-select:disabled { opacity: 0.5; cursor: not-allowed; }

/* skip_l3 checkbox */
.ag-skip-l3 { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--ag-text-secondary); cursor: pointer; white-space: nowrap; }
.ag-skip-l3:hover { color: var(--ag-text); }
.ag-skip-l3 input { width: 14px; height: 14px; cursor: pointer; accent-color: var(--ag-accent); }

/* 搜索结果层标识 */
.ag-layer-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 600; color: #fff; }
.ag-layer-l1 { background: #6366f1; }
.ag-layer-l2 { background: #0ea5e9; }
.ag-layer-l3 { background: #14b8a6; }
.ag-status-text { font-size: 11px; font-weight: 500; }
.ag-status-on { color: var(--ag-green); }
.ag-status-off { color: var(--ag-text-tertiary); }
.ag-search-cat { font-size: 11px; color: var(--ag-text-tertiary); }

/* 统计卡片 */
.ag-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
.ag-stat-card { background: var(--ag-code-bg); border-radius: 10px; padding: 12px; }
.ag-stat-card .label { font-size: 11px; color: var(--ag-text-secondary); }
.ag-stat-card .value { font-size: 22px; font-weight: 600; color: var(--ag-text-heading); margin-top: 4px; }

/* 进度条行 */
.ag-progress-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; font-size: 13px; }
.ag-progress-label { color: var(--ag-text-secondary); min-width: 100px; }
.ag-progress-value { color: var(--ag-text-heading); font-weight: 600; }
.ag-progress-pct { font-size: 11px; color: var(--ag-text-tertiary); }
.ag-progress-bar { flex: 1; background: var(--ag-divider); height: 6px; border-radius: 3px; margin-left: 8px; overflow: hidden; }
.ag-progress-fill { background: var(--ag-accent); height: 6px; border-radius: 3px; }
.ag-progress-fill.green { background: var(--ag-green); }

/* 日期选择器 */
.ag-date-input { padding: 3px 8px; font-size: 12px; height: 24px; border: 1px solid var(--ag-input-border); border-radius: 4px; background: var(--ag-input-bg); color: var(--ag-text); font-family: inherit; box-sizing: border-box; }
.ag-date-input:focus { outline: none; border-color: var(--ag-accent); box-shadow: 0 0 0 2px var(--ag-input-focus-ring); }
.ag-date-sep { color: var(--ag-text-tertiary); font-size: 12px; padding: 0 4px; }

.ag-search { margin-bottom: 12px; }
.ag-empty { color: var(--ag-text-tertiary); font-size: 12px; padding: 12px 0; text-align: center; }
#token-trend-chart { width: 100%; height: 320px; }
.ag-link { color: var(--ag-accent); cursor: pointer; text-decoration: none; font-size: 12px; }
.ag-link:hover { text-decoration: underline; }

/* Toast */
.ag-toast { position: fixed; top: 20px; right: 20px; padding: 12px 20px; border-radius: 8px; font-size: 13px; z-index: 10000; box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: ag-slide-in .3s ease; }
/* 仅内置规则模式的顶部横幅是 sticky + z-index 9999；toast 必须在其之上，
   并下移一个横幅高度，否则错误提示会被横幅挡住。 */
body.builtin-only-mode .ag-toast { top: calc(20px + var(--am-builtin-banner-height, 48px)); }
.ag-toast-success { background: var(--ag-green); color: #fff; }
.ag-toast-error { background: var(--ag-red); color: #fff; }
.ag-toast-warning { background: var(--ag-orange); color: #fff; }
@keyframes ag-slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

/* Modal */
.ag-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 100; }
.ag-modal-overlay.show { display: flex; }
.ag-modal { background: var(--ag-bg); border: 1px solid var(--ag-card-border); border-radius: 14px; padding: 24px; width: 540px; max-width: 92vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
.ag-modal.ag-modal-wide { width: 820px; }
.ag-modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
/* Confirm 弹窗（替代浏览器原生 confirm） */
.ag-modal-confirm { width: 420px; }
.ag-confirm-body { font-size: 13px; line-height: 1.7; color: var(--ag-text-secondary); white-space: pre-wrap; word-break: break-word; padding: 4px 0 8px; }
/* Prompt 弹窗（替代浏览器原生 prompt） */
.ag-prompt-body { padding: 4px 0 8px; }
.ag-prompt-message { font-size: 13px; line-height: 1.7; color: var(--ag-text-secondary); margin-bottom: 12px; }
.ag-modal-title { font-size: 15px; font-weight: 600; color: var(--ag-text-heading); }
.ag-modal-close { width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px; cursor: pointer; font-size: 18px; line-height: 1; color: var(--ag-text-tertiary); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ag-modal-close:hover { background: var(--ag-code-bg); color: var(--ag-text); }
.ag-form-group { margin-bottom: 12px; }
.ag-form-label { font-size: 13px; font-weight: 500; margin-bottom: 4px; color: var(--ag-text); }
.ag-form-label .ag-required { color: var(--ag-red); margin-left: 2px; }
.ag-form-hint { font-size: 11px; color: var(--ag-text-tertiary); margin-top: 3px; line-height: 1.5; }
.ag-form-hint code { background: var(--ag-code-bg); padding: 1px 4px; border-radius: 3px; font-family: 'SF Mono', monospace; }
.ag-form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Skill 详情 */
.ag-skill-detail-header { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.ag-skill-detail-id { font-size: 17px; font-weight: 700; color: var(--ag-text-heading); font-family: 'SF Mono', monospace; word-break: break-all; }
.ag-skill-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--ag-divider); }
.ag-skill-meta-item { font-size: 12px; color: var(--ag-text-secondary); background: var(--ag-code-bg); padding: 3px 10px; border-radius: 4px; border: 1px solid var(--ag-divider); }
.ag-skill-meta-item strong { color: var(--ag-text); font-weight: 600; }
.ag-skill-content { font-family: 'SF Mono', monospace; font-size: 12.5px; line-height: 1.7; color: var(--ag-text); white-space: pre-wrap; word-break: break-word; }
.ag-skill-content pre { background: #1e293b; color: #e2e8f0; padding: 14px 16px; border-radius: 8px; overflow-x: auto; margin: 12px 0; font-size: 12.5px; line-height: 1.65; }
.ag-skill-content pre code { background: transparent; color: inherit; padding: 0; }

/* 表格 */
.ag-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.ag-table th { padding: 6px; text-align: left; border-bottom: 1px solid var(--ag-divider); color: var(--ag-text-secondary); font-weight: 500; }
.ag-table td { padding: 6px; border-bottom: 1px solid var(--ag-divider); }
</style>
</head>
<body>
<div id="builtin-only-banner" style="display:none;background:#b45309;color:#fff;padding:6px 14px;font-size:12px;line-height:1.5;text-align:center;position:sticky;top:0;z-index:9999">
  仅内置规则模式：已忽略 runtime 配置与 Console 自定义，修改规则不会生效。需重启服务并移除 <code>AGENT_MOSS_RULES_BUILTIN_ONLY</code> 后再改规则。<br>
  Built-in rules only: runtime config and Console changes are ignored. Restart without <code>AGENT_MOSS_RULES_BUILTIN_ONLY</code> to edit rules.
</div>
<div class="ag-wrap">
  <div class="ag-tabs" id="tabs">
    <div class="ag-tab active" data-page="overview">概览</div>
    <div class="ag-tab" data-page="search">搜索规则</div>
    <div class="ag-tab" data-page="l1">L1 规则</div>
    <div class="ag-tab" data-page="l2">L2 规则</div>
    <div class="ag-tab" data-page="l3">L3 Skills</div>
    <div class="ag-tab" data-page="agents">Agent 定制</div>
    <div class="ag-tab" data-page="scenarios">场景定制</div>
    <div class="ag-tab" data-page="token">Token</div>
    <div class="ag-tab" data-page="settings">设置</div>
    <div class="ag-tab-spacer"></div>
    <button class="ag-theme-btn" id="theme-btn">🌙 暗色</button>
  </div>
  <div class="ag-panel" id="page-overview"></div>
  <div class="ag-panel hidden" id="page-search"></div>
  <div class="ag-panel hidden" id="page-l1"></div>
  <div class="ag-panel hidden" id="page-l2"></div>
  <div class="ag-panel hidden" id="page-l3"></div>
  <div class="ag-panel hidden" id="page-agents"></div>
  <div class="ag-panel hidden" id="page-scenarios"></div>
  <div class="ag-panel hidden" id="page-token"></div>
  <div class="ag-panel hidden" id="page-settings"></div>
</div>

<!-- Modal -->
<div class="ag-modal-overlay" id="modal-overlay">
  <div class="ag-modal" id="modal">
    <div class="ag-modal-header">
      <div class="ag-modal-title" id="modal-title"></div>
      <button class="ag-modal-close" onclick="closeModal()" title="关闭">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="ag-form-actions" id="modal-actions">
      <button class="ag-btn ag-btn-ghost" onclick="closeModal()">取消</button>
      <button class="ag-btn ag-btn-primary" id="modal-submit" onclick="submitModal()">确认</button>
    </div>
  </div>
</div>

<!-- Confirm 弹窗（替代浏览器原生 confirm） -->
<div class="ag-modal-overlay" id="confirm-overlay">
  <div class="ag-modal ag-modal-confirm" id="confirm-modal">
    <div class="ag-modal-header">

function detectLang() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('lang');
  if (q === 'en' || q === 'zh') return q;
  const docLang = (document.documentElement.lang || '').toLowerCase();
  return docLang.indexOf('zh') === 0 ? 'zh' : 'zh'; // 默认中文
}
const LANG = detectLang();
const isEn = LANG === 'en';
/** t(zh, en)：中文为默认回退，en 模式下返回英文翻译。 */
function t(zh, en) { return isEn ? (en != null && en !== '' ? en : zh) : zh; }

document.documentElement.lang = isEn ? 'en' : 'zh-CN';

// ===== API client =====
const TOKEN_KEY = 'am_console_token';
// ?token=xxx：桌面端（OpenDesk）用 iframe 嵌入时注入。iframe 与父页面不同源，
// localStorage 不共享，只能走 URL；读到后立刻从地址栏移除，避免留在历史记录里。
(function adoptTokenFromUrl() {
  try {
    const u = new URL(location.href);
    const t_ = u.searchParams.get('token');
    if (!t_) return;
    localStorage.setItem(TOKEN_KEY, t_);
    u.searchParams.delete('token');
    history.replaceState(null, '', u.pathname + (u.search || '') + u.hash);
  } catch (e) { /* 受限环境：忽略 */ }
})();
function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function authHeaders() {
  const t_ = getToken();
  return t_ ? { 'Authorization': 'Bearer ' + t_ } : {};
}
async function api(path, opts = {}) {
  const res = await fetch('/console/api/' + path, {
    headers: { 'Content-Type': 'application/json', ...authHeaders() },
    ...opts,
  });
  if (res.status === 401) {
    const t_ = await agPrompt(t('需要访问凭据', 'Access Token Required'), {
      message: t('服务端开启了访问认证，需要 Bearer token 才能访问安全策略管控台：', 'The server requires a Bearer token to access the policy console:'),
      placeholder: t('输入服务端配置的 token', 'Enter the server-configured token'),
      value: getToken(),
      okText: t('保存并重试', 'Save & Retry'),
    });
    if (t_) { localStorage.setItem(TOKEN_KEY, t_); return api(path, opts); }
    throw new Error(t('未授权', 'Unauthorized'));
  }
  if (!res.ok) {
    const d = await res.json().catch(() => ({}));
    throw new Error(d.detail || res.statusText);
  }
  return res.json();
}
function apiPut(path, body) { return api(path, { method: 'PUT', body: JSON.stringify(body) }); }
function apiPost(path, body) { return api(path, { method: 'POST', body: JSON.stringify(body) }); }

/** 拉取并解包 env 覆盖映射（/api/env-overrides 返回 {overrides: {...}}，此处解出净映射）。 */

let state = { config: {}, envOverrides: {}, currentPage: 'overview' };

const RISK_TYPE_NAMES = {

const RISK_TOOLTIPS = {

function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function riskBadge(level) {

function formatTokens(n) {
  if (n >= 1e8) return (n / 1e8).toFixed(1) + t('亿', 'B');
  if (n >= 1e4) return (n / 1e4).toFixed(1) + t('万', 'W');

// ===== Confirm 弹窗（替代浏览器原生 confirm，统一样式）=====
let confirmResolve = null;
function closeConfirm() {
  el('confirm-overlay').classList.remove('show');
  if (confirmResolve) { confirmResolve(false); confirmResolve = null; }
}
function resolveConfirm() {
  el('confirm-overlay').classList.remove('show');
  if (confirmResolve) { confirmResolve(true); confirmResolve = null; }
}
/**
 * 弹出带样式的确认框，返回 Promise<boolean>。
 * @param {string} title 标题
 * @param {string} message 正文（支持 \n，自动转义为纯文本）

 * @param {string} [okClass] 确认按钮样式类（默认 ag-btn-danger）
 */
function agConfirm(title, message, okText, okClass) {
  return new Promise(resolve => {
    confirmResolve = resolve;
    el('confirm-title').textContent = title;
    el('confirm-body').textContent = message;
    const okBtn = el('confirm-ok');
    okBtn.className = 'ag-btn ' + (okClass || 'ag-btn-danger');
    okBtn.textContent = okText || t('确认', 'Confirm');
    el('confirm-overlay').classList.add('show');
  });
}

// ===== Prompt 弹窗（替代浏览器原生 prompt，用于 token 输入等）=====
let promptResolve = null;
function closePrompt() {
  el('prompt-overlay').classList.remove('show');
  if (promptResolve) { promptResolve(null); promptResolve = null; }
}
function submitPrompt() {
  const val = el('prompt-input').value;
  el('prompt-overlay').classList.remove('show');
  if (promptResolve) { promptResolve(val); promptResolve = null; }
}
/**
 * 弹出带样式的输入框，返回 Promise<string|null>（取消返回 null）。
 * @param {string} title 标题
 * @param {Object} opts
 * @param {string} [opts.message] 说明文案
 * @param {string} [opts.placeholder] 输入框占位文案
 * @param {string} [opts.value] 初始值
 * @param {string} [opts.okText] 确认按钮文案（默认 "确认"）
 */
function agPrompt(title, opts = {}) {
  return new Promise(resolve => {
    promptResolve = resolve;
    el('prompt-title').textContent = title;
    el('prompt-body').innerHTML =
      (opts.message ? `<div class="ag-prompt-message">${escapeHtml(opts.message)}</div>` : '') +
      `<input class="ag-input" id="prompt-input" type="password" style="width:100%" placeholder="${escapeHtml(opts.placeholder || '')}" value="${escapeHtml(opts.value || '')}" autocomplete="off">`;
    el('prompt-ok').textContent = opts.okText || t('确认', 'Confirm');
    el('prompt-overlay').classList.add('show');
    const input = el('prompt-input');
    input.focus();
    input.select();
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); submitPrompt(); }
      if (e.key === 'Escape') { e.preventDefault(); closePrompt(); }
    });
  });
}

async function refreshConfig() {
  state.config = await api('config');
  // cold / builtin 模式：顶部显示只读横幅（写接口由后端统一 403）
  const rulesMode = state.config.rules_mode || (state.config.builtin_only ? 'builtin' : 'hot');
  if (rulesMode === 'cold' || rulesMode === 'builtin') {
    const banner = el('builtin-only-banner');
    if (banner) {
      banner.innerHTML = rulesMode === 'cold'
        ? '冷启动规则模式：runtime 配置与 Console 自定义已忽略；规则目录仅在启动时读取一次，修改规则目录需重启服务。<br>'
          + 'Cold-start rules mode: runtime config and Console changes are ignored. Rule directories are loaded once at startup; restart to apply changes.'
        : '仅内置规则模式：已忽略 runtime 配置与 Console 自定义，修改规则不会生效。需重启服务并移除 <code>AGENT_MOSS_RULES_BUILTIN_ONLY</code> 后再改规则。<br>'
          + 'Built-in rules only: runtime config and Console changes are ignored. Restart without <code>AGENT_MOSS_RULES_BUILTIN_ONLY</code> to edit rules.';
      banner.style.display = 'block';
      // 记录横幅实际高度（窄屏会换行），让 toast 显示在横幅下方而不是被挡住
      document.documentElement.style.setProperty(
        '--am-builtin-banner-height', banner.offsetHeight + 'px'
      );
      document.body.classList.add('builtin-only-mode');
    }
  }
  state.envOverrides = await loadEnvOverrides();
  state.agentRules = await api('agents');
  // 场景定制规则：后端按 AGENT_MOSS_SCENARIO env 过滤（无 env 返回空 → 场景页显示"未启用"提示）
  state.scenarioRules = await api('scenarios');
  // 探测当前进程的 instance（AGENT_MOSS_INSTANCE，如 opendesk/xiaoo）。
  // 有 instance 时 Agent Rules 页只显示当前 agent 的定制规则，避免出现别的 agent 的规则造成困惑；
  // 无 instance（本地独立起服务/非 agent 调用）则显示全部。
  state.instance = '';
  try {
    const h = await fetch('/api/v1/health', { signal: AbortSignal.timeout(2000) });
    if (h.ok) {
      const hd = await h.json();
      state.instance = hd?.instance || '';
    }
  } catch { /* health 不可达，instance 保持空（显示全部） */ }
  // 探测服务端是否开启了 console 访问 token 认证（AGENT_MOSS_CONSOLE_TOKEN）。
  // 不带 token 裸请求一个 API 端点：返回 401 说明开启了认证 → 设置页显示"访问 Token"卡片；
  // 返回 200 说明本机免认证 → 隐藏该卡片（单机使用无需配置，避免误导）。
  state.consoleAuthRequired = false;
  try {
    const probe = await fetch('/console/api/env-overrides', { signal: AbortSignal.timeout(2000) });
    state.consoleAuthRequired = probe.status === 401;
  } catch { /* 探测失败，默认不显示 token 卡片 */ }
  renderCurrent();
}
function renderCurrent() {
  const pages = ['overview','search','l1','l2','l3','agents','scenarios','token','settings'];
  pages.forEach(p => {
    const panel = el('page-' + p);
    if (panel) panel.classList.toggle('hidden', p !== state.currentPage);

  const fn = window['render_' + state.currentPage];
  if (fn) fn();
}

function countRules(lr) { if (!lr) return 0; return Object.values(lr).reduce((s, c) => s + (c.rules ? c.rules.length : 0), 0); }

function renderSkillContent(md, skillId, filePath) {
  const lines = (md || '').split('\n');
  let html = '<div class="ag-skill-detail-header"><span class="ag-skill-detail-id">' + escapeHtml(skillId) + '</span></div><div class="ag-skill-meta"><span class="ag-skill-meta-item">📄 <strong>' + escapeHtml(filePath || t('(未知)', '(unknown)')) + '</strong></span><span class="ag-skill-meta-item">📏 <strong>' + lines.length + '</strong> ' + t('行', 'lines') + '</span></div><div class="ag-skill-content">';
  let inCode = false, codeBuf = [], textBuf = [];
  const flushText = () => { if (textBuf.length) { html += escapeHtml(textBuf.join('\n')); textBuf = []; } };
  const flushCode = () => { if (codeBuf.length) { html += '<pre><code>' + escapeHtml(codeBuf.join('\n')) + '</code></pre>'; codeBuf = []; } };
  for (const line of lines) {
    if (/^```/.test(line.trim())) {
      if (inCode) { flushText(); flushCode(); inCode = false; }
      else { flushText(); inCode = true; }
      continue;
    }
    if (inCode) codeBuf.push(line); else textBuf.push(line);
  }
  flushText(); if (inCode) flushCode();
  html += '</div>';
  return html;
}

function render_search() {
  el('page-search').innerHTML = `
    <div class="ag-card">
      <div class="ag-section-title">${t('全局规则搜索', 'Global Rule Search')}</div>
      <div style="display:flex;gap:8px">
        <input class="ag-input" id="search-input" placeholder="${t('输入关键词搜索规则，如: sysfs, rm -rf, /etc/shadow, 数据外泄...', 'Search rules by keyword, e.g. sysfs, rm -rf, /etc/shadow, data exfiltration...')}" oninput="searchRules()" style="flex:1">
        <button class="ag-btn ag-btn-primary" onclick="searchRules()">${t('搜索', 'Search')}</button>
        <button class="ag-btn ag-btn-ghost" onclick="clearSearch()">${t('清空', 'Clear')}</button>
      </div>
      <div class="ag-form-hint" style="margin-top:8px">${t('搜索范围：L1 规则的正则/原因/风险类型、L2 规则的路径/描述、L3 Skill 的关键词/ID。命中后可直接启用或禁用对应规则。', 'Search scope: L1 rule regex/reason/risk type, L2 rule path/description, L3 Skill keyword/ID. You can enable or disable the matching rule directly.')}</div>
    </div>
    <div class="ag-card" id="search-results-card" style="display:none">
      <div class="ag-section-title">${t('搜索结果', 'Search Results')} <span class="ag-cat-count" id="search-count">0 ${t('条', 'results')}</span></div>
      <div id="search-results"></div>
    </div>`;
  setTimeout(() => { const inp = el('search-input'); if (inp) inp.focus(); }, 0);
}
function searchRules() {
  const q = (el('search-input') ? el('search-input').value : '').trim().toLowerCase();
  const card = el('search-results-card'), list = el('search-results'), cnt = el('search-count');
  if (!q) { card.style.display = 'none'; list.innerHTML = ''; return; }
  const results = [];
  for (const [cat, cd] of Object.entries(state.config.L1_rules || {})) {
    for (const r of (cd.rules || [])) {
      const hay = [r.id, r.pattern, r.keyword, r.reason, r.risk_type, r.risk_level].filter(Boolean).join(' ').toLowerCase();
      if (hay.includes(q)) results.push({ layer: 'L1_rules', layerName: 'L1', category: cat, ...r });
    }
  }
  for (const [cat, cd] of Object.entries(state.config.L2_rules || {})) {
    for (const r of (cd.rules || [])) {
      const hay = [r.id, r.path, r.pattern, r.desc, r.reason, r.risk_type, r.risk_level].filter(Boolean).join(' ').toLowerCase();
      if (hay.includes(q)) results.push({ layer: 'L2_rules', layerName: 'L2', category: cat, ...r });
    }
  }
  for (const [cat, cd] of Object.entries(state.config.L3_skills || {})) {
    for (const s of (cd.skills || [])) {
      const hay = [s.id, (s.keywords || []).join(' ')].filter(Boolean).join(' ').toLowerCase();
      if (hay.includes(q)) results.push({ layer: 'L3_skills', layerName: 'L3', category: cat, ...s, isSkill: true });
    }
  }
  cnt.textContent = results.length + ' ' + t('条', 'results');
  card.style.display = '';

const TREND_COLORS = ['#007AFF','#FF3B30','#34C759','#FF9500','#AF52DE','#5AC8FA','#FFCC00','#64D2FF'];
function renderTokenTrend(data) {
  const dom = el('token-trend-chart');
  if (!dom || !window.echarts) return;

  if (!trendChartInstance) trendChartInstance = echarts.init(dom);

      connectNulls: true,

    })),
  }, true);
}

async function goTokenRecentPage() {

    formHtml = `<div class="ag-form-group"><div class="ag-form-label">${t('规则类型', 'Rule Type')}<span class="ag-required">*</span></div><select class="ag-select" id="rule-type" onchange="updateRuleForm()"><option value="pattern">${t('正则模式匹配', 'Regex pattern matching')}</option><option value="keyword">${t('关键词匹配', 'Keyword matching')}</option></select><div class="ag-form-hint">${t('正则模式：用正则表达式匹配命令（如 ', 'Regex mode: match the command with a regex (e.g. ')}<code>\\brm\\s+-rf</code>${t('）；关键词匹配：命令中包含指定文字即命中。', '); keyword mode: command containing the text matches.')}</div></div>
      <div class="ag-form-group" id="form-pattern"><div class="ag-form-label">${t('正则 Pattern', 'Regex Pattern')}<span class="ag-required">*</span></div><input class="ag-input" id="input-pattern" placeholder="${t('如: ', 'e.g. ')}${'\\brm\\s+-rf'}"><div class="ag-form-hint">${t('Python 正则表达式，命中该正则的命令会触发本规则。', 'Python regex. Commands matching this regex trigger this rule.')}</div></div>
      <div class="ag-form-group" id="form-keyword" style="display:none"><div class="ag-form-label">${t('关键词', 'Keyword')}<span class="ag-required">*</span></div><input class="ag-input" id="input-keyword" placeholder="${t('如: ignore previous instructions', 'e.g. ignore previous instructions')}"><div class="ag-form-hint">${t('命令文本中包含此关键词即命中（不区分大小写）。', 'Command text containing this keyword matches (case-insensitive).')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('风险等级', 'Risk Level')}<span class="ag-required">*</span></div><select class="ag-select" id="input-risk-level"><option value="critical">Critical（${t('严重', 'Critical')}）</option><option value="high">High（${t('高危', 'High')}）</option><option value="medium">Medium（${t('中危', 'Medium')}）</option><option value="low">Low（${t('低危', 'Low')}）</option></select><div class="ag-form-hint"><strong>critical / high</strong>：${t('在 L1 层直接拦截（Deny），命令不会执行；', 'block directly at L1 (Deny), the command will not run;')}<br><strong>medium / low</strong>：${t('不在 L1 拦截，转交 L3 LLM 深度分析判断。', 'not blocked at L1; handed to L3 LLM deep analysis.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('风险类型', 'Risk Type')}</div><input class="ag-input" id="input-risk-type" placeholder="${t('如: script_execution, file_access, data_exfiltration', 'e.g. script_execution, file_access, data_exfiltration')}"><div class="ag-form-hint">${t('风险分类标签，用于统计与展示。可选值：script_execution（脚本执行）、file_access（文件访问）、data_exfiltration（数据外泄）等，可自定义。', 'Risk classification label for stats and display. Options: script_execution, file_access, data_exfiltration, etc. Custom values allowed.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('拦截原因', 'Block Reason')}<span class="ag-required">*</span></div><input class="ag-input" id="input-reason" placeholder="${t('描述为什么这条规则要拦截', 'Describe why this rule blocks')}"><div class="ag-form-hint">${t('命中时展示给用户的说明文字，应写清为什么危险。L3 分析时也会参考此原因。', 'Text shown to the user on match; explain why it is dangerous. L3 analysis also references this reason.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('语言（仅关键词类型）', 'Language (keyword type only)')}</div><select class="ag-select" id="input-lang"><option value="en">English</option><option value="zh">中文</option></select><div class="ag-form-hint">${t('关键词的语言，影响匹配时的分词处理。', 'The language of the keyword affects tokenization during matching.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('所属分类', 'Category')}</div><select class="ag-select" id="input-category"><option value="user_custom">${t('用户自定义', 'User custom')}</option><option value="dangerous_commands">${t('危险命令检测', 'Dangerous commands')}</option><option value="injection_detection">${t('注入攻击检测', 'Injection detection')}</option></select></div>`;
  } else if (isL2) {
    formHtml = `<div class="ag-form-group"><div class="ag-form-label">${t('规则类型', 'Rule Type')}<span class="ag-required">*</span></div><select class="ag-select" id="rule-type-l2" onchange="updateL2RuleForm()"><option value="path">${t('敏感路径', 'Sensitive path')}</option><option value="pattern">${t('正则模式', 'Regex pattern')}</option></select><div class="ag-form-hint">${t('敏感路径：匹配文件路径（如 ', 'Sensitive path: match a file path (e.g. ')}<code>/etc/shadow</code>${t('）；正则模式：用正则匹配命令文本。', '); regex mode: match command text with regex.')}</div></div>
      <div class="ag-form-group" id="form-l2-path"><div class="ag-form-label">${t('路径', 'Path')}<span class="ag-required">*</span></div><input class="ag-input" id="input-l2-path" placeholder="${t('如: /etc/shadow, .ssh/id_rsa', 'e.g. /etc/shadow, .ssh/id_rsa')}"><div class="ag-form-hint">${t('要拦截的文件路径，多个用英文逗号分隔。命令访问到这些路径即命中。', 'File paths to block; separate multiple with commas. Commands accessing these paths match.')}</div></div>
      <div class="ag-form-group" id="form-l2-pattern" style="display:none"><div class="ag-form-label">${t('正则 Pattern', 'Regex Pattern')}<span class="ag-required">*</span></div><input class="ag-input" id="input-l2-pattern" placeholder="${t('如: ', 'e.g. ')}${'\\bpasswd\\s+--stdin'}"><div class="ag-form-hint">${t('Python 正则表达式，命中即触发。', 'Python regex; triggers on match.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('描述', 'Description')}<span class="ag-required">*</span></div><input class="ag-input" id="input-l2-desc" placeholder="${t('路径/规则的中文描述', 'Chinese description of the path/rule')}"><div class="ag-form-hint">${t('命中时展示给用户的说明。', 'Description shown to the user on match.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('风险等级', 'Risk Level')}<span class="ag-required">*</span></div><select class="ag-select" id="input-l2-risk-level"><option value="critical">Critical（${t('严重', 'Critical')}）</option><option value="high">High（${t('高危', 'High')}）</option><option value="medium">Medium（${t('中危', 'Medium')}）</option><option value="low">Low（${t('低危', 'Low')}）</option></select><div class="ag-form-hint"><strong>critical / high</strong>：${t('在 L2 层直接拦截；', 'block directly at L2;')}<br><strong>medium / low</strong>：${t('不在 L2 拦截，转交 L3 LLM 判断。', 'not blocked at L2; handed to L3 LLM.')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('拦截模式', 'Interception Mode')}</div><select class="ag-select" id="input-l2-deny-mode"><option value="deny_write">${t('仅拦截写入', 'Block Write Only')}</option><option value="deny_read">${t('仅拦截读取', 'Block Read Only')}</option><option value="deny_both">${t('读写均拦截', 'Block Both')}</option></select><div class="ag-form-hint">${t('选择该路径的拦截模式：仅拦截写入（默认）、仅拦截读取（如 /dev/random）、读写均拦截（凭据文件）。', 'Choose interception mode: block write only (default), block read only (e.g. /dev/random), block both (credential files).')}</div></div>
      <div class="ag-form-group"><div class="ag-form-label">${t('所属分类', 'Category')}</div><select class="ag-select" id="input-l2-category"><option value="sensitive_path_access">${t('敏感路径访问', 'Sensitive path access')}</option><option value="password_modify_consent">${t('密码修改授权', 'Password modify consent')}</option><option value="user_deletion_consent">${t('用户删除授权', 'User deletion consent')}</option><option value="intent_consistency">${t('意图一致性', 'Intent consistency')}</option></select></div>`;
  }
  openModal(title, formHtml);
}
function showAddSkillModal() {
  currentModalAction = { type: 'add_skill' };
  openModal(t('新增 L3 Skill', 'Add L3 Skill'), `<div class="ag-form-group"><div class="ag-form-label">${t('Skill ID（文件名）', 'Skill ID (file name)')}</div><input class="ag-input" id="input-skill-id" placeholder="${t('如: my_custom_guard', 'e.g. my_custom_guard')}"><div class="ag-form-hint">${t('Skill 文件名（不含扩展名），英文+下划线。会成为该 Skill 的唯一标识。', 'Skill file name (without extension), letters + underscores. Becomes the Skill’s unique ID.')}</div></div>
    <div class="ag-form-group"><div class="ag-form-label">${t('触发关键词', 'Trigger Keywords')}<span class="ag-required">*</span></div><input class="ag-input" id="input-skill-keywords" placeholder="${t('逗号分隔, 如: custom, 特殊, special', 'comma-separated, e.g. custom, special')}"><div class="ag-form-hint">${t('命令/动作中包含这些关键词时，该 Skill 会被匹配并注入 L3 的 LLM prompt。', 'When the command/action contains these keywords, the Skill matches and is injected into the L3 LLM prompt.')}</div></div>
    <div class="ag-form-group"><div class="ag-form-label">${t('Skill 内容（Markdown）', 'Skill Content (Markdown)')}<span class="ag-required">*</span></div><textarea class="ag-input" id="input-skill-content" rows="4" placeholder="# Skill 规则标题\n\n## 适用场景\n..."></textarea><div class="ag-form-hint">${t('Markdown 格式的规则说明。命中关键词后会作为提示注入 LLM。', 'Markdown rule description. Injected into the LLM prompt on keyword match.')}</div></div>
    <div class="ag-form-group"><div class="ag-form-label">${t('所属分类', 'Category')}</div><select class="ag-select" id="input-skill-category"><option value="user_custom">${t('用户自定义', 'User custom')}</option><option value="file_operations">${t('文件操作', 'File operations')}</option><option value="network_security">${t('网络安全', 'Network security')}</option><option value="intent_and_general">${t('意图/通用', 'Intent/general')}</option></select></div>`);
}
function updateRuleForm() {
  const tt = document.getElementById('rule-type')?.value;
  const p = document.getElementById('form-pattern'), k = document.getElementById('form-keyword');
  if (p) p.style.display = tt === 'pattern' ? '' : 'none';
  if (k) k.style.display = tt === 'keyword' ? '' : 'none';
}
function updateL2RuleForm() {
  const tt = document.getElementById('rule-type-l2')?.value;
  const p = document.getElementById('form-l2-path'), k = document.getElementById('form-l2-pattern');
  if (p) p.style.display = tt === 'path' ? '' : 'none';
  if (k) k.style.display = tt === 'pattern' ? '' : 'none';
}
async function submitModal() {
  if (!currentModalAction) return;
  try {
    if (currentModalAction.type === 'add_rule') {
      const layer = currentModalAction.layer;
      const isL1 = layer === 'L1_rules', isL2 = layer === 'L2_rules';
      let body = { layer };
      if (isL1) {
        const ruleType = document.getElementById('rule-type')?.value || 'pattern';
        body.category = document.getElementById('input-category')?.value || 'user_custom';
        body.risk_level = document.getElementById('input-risk-level')?.value;
        body.risk_type = document.getElementById('input-risk-type')?.value || undefined;
        body.reason = document.getElementById('input-reason')?.value;
        if (ruleType === 'pattern') body.pattern = document.getElementById('input-pattern')?.value;
        else { body.keyword = document.getElementById('input-keyword')?.value; body.lang = document.getElementById('input-lang')?.value; }
      } else if (isL2) {
        const ruleType = document.getElementById('rule-type-l2')?.value || 'path';
        body.category = document.getElementById('input-l2-category')?.value || 'sensitive_path_access';
        body.risk_level = document.getElementById('input-l2-risk-level')?.value;
        body.desc = document.getElementById('input-l2-desc')?.value;
        const dm = document.getElementById('input-l2-deny-mode')?.value;
        if (dm) body.deny_mode = dm;
        if (ruleType === 'path') body.path = document.getElementById('input-l2-path')?.value;
        else { body.pattern = document.getElementById('input-l2-pattern')?.value; body.risk_type = 'script_execution'; }
      }
      state.config = await apiPost('rules', body);
      showToast(t('规则已添加', 'Rule added'));
    } else if (currentModalAction.type === 'add_skill') {
      const keywords = (document.getElementById('input-skill-keywords')?.value || '').split(',').map(s => s.trim()).filter(Boolean);
      state.config = await apiPost('skills', {
        skill_id: document.getElementById('input-skill-id')?.value,
        category: document.getElementById('input-skill-category')?.value || 'user_custom',
        keywords,
        content: document.getElementById('input-skill-content')?.value,
      });
      showToast(t('Skill 已添加', 'Skill added'));
    } else if (currentModalAction.type === 'agent_rule') {
      const { agentId, cat, isValueCat } = currentModalAction;
      const payload = { agent_id: agentId, category: cat };
      if (isValueCat) {
        payload.value = el('ar-value').value.trim();
        if (!payload.value) { showToast(t('值不能为空', 'Value cannot be empty'), 'error'); return; }
      } else {
        payload.pattern = el('ar-pattern').value.trim();
        payload.risk_level = el('ar-risk_level').value.trim() || undefined;
      }
      state.agentRules = await apiPost('agents/rules', payload);
      showToast(t('Agent 规则已添加', 'Agent rule added'));
    } else if (currentModalAction.type === 'scenario_rule') {
      const { scenarioId, cat } = currentModalAction;
      const payload = { scenario_id: scenarioId, category: cat };
      payload.pattern = el('ar-pattern').value.trim();
      if (!payload.pattern) { showToast(t('规则不能为空', 'Rule cannot be empty'), 'error'); return; }
      payload.risk_level = el('ar-risk_level').value.trim() || undefined;
      state.scenarioRules = await apiPost('scenarios/rules', payload);
      showToast(t('场景规则已添加', 'Scenario rule added'));
    }
    renderCurrent();
    closeModal();
  } catch (e) { showToast(t('添加失败: ', 'Add failed: ') + e.message, 'error'); }
}

// ===== Tab nav + theme =====
document.querySelectorAll('.ag-tab[data-page]').forEach(tab => {
  tab.onclick = () => {
    stopTokenAutoRefresh();
    state.currentPage = tab.dataset.page;
    document.querySelectorAll('.ag-tab').forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    renderCurrent();
  };
});
function applyTabLabels() {
  const labels = {
    overview: t('概览', 'Overview'),
    search: t('搜索规则', 'Search Rules'),
    l1: t('L1 规则', 'L1 Rules'),
    l2: t('L2 规则', 'L2 Rules'),
    l3: t('L3 Skills', 'L3 Skills'),
    agents: t('Agent 定制', 'Agent Rules'),
    token: t('Token', 'Token'),
    settings: t('设置', 'Settings'),
  };
  document.querySelectorAll('.ag-tab[data-page]').forEach(tab => {
    tab.textContent = labels[tab.dataset.page] || tab.textContent;
  });
  const themeBtn = el('theme-btn');
  if (themeBtn) themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? t('☀️ 浅色', '☀️ Light') : t('🌙 暗色', '🌙 Dark');
  const closeBtn = document.querySelector('.ag-modal-close');
  if (closeBtn) closeBtn.setAttribute('title', t('关闭', 'Close'));
  const cancelBtn = el('modal-actions') ? document.querySelector('#modal-actions .ag-btn-ghost') : null;
  if (cancelBtn) cancelBtn.textContent = t('取消', 'Cancel');
  const submitBtn = el('modal-submit');
  if (submitBtn) submitBtn.textContent = t('确认', 'Confirm');
  // Confirm 弹窗（替代浏览器原生 confirm）
  const confirmCancelBtn = document.querySelector('#confirm-actions .ag-btn-ghost');
  if (confirmCancelBtn) confirmCancelBtn.textContent = t('取消', 'Cancel');
  const confirmCloseBtn = document.querySelector('#confirm-overlay .ag-modal-close');
  if (confirmCloseBtn) confirmCloseBtn.setAttribute('title', t('关闭', 'Close'));
  // Prompt 弹窗（替代浏览器原生 prompt）
  const promptCancelBtn = document.querySelector('#prompt-actions .ag-btn-ghost');
  if (promptCancelBtn) promptCancelBtn.textContent = t('取消', 'Cancel');
  const promptCloseBtn = document.querySelector('#prompt-overlay .ag-modal-close');
  if (promptCloseBtn) promptCloseBtn.setAttribute('title', t('关闭', 'Close'));
}
el('theme-btn').onclick = () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  el('theme-btn').textContent = next === 'dark' ? t('☀️ 浅色', '☀️ Light') : t('🌙 暗色', '🌙 Dark');
  if (state.currentPage === 'token') render_token();
};

// ===== Init =====
applyTitle();
applyTabLabels();
refreshConfig().catch(e => { document.body.innerHTML = '<div style="padding:40px;color:#FF3B30">' + t('加载失败: ', 'Load failed: ') + escapeHtml(e.message) + '</div>'; });
</script>
</body>
</html>
