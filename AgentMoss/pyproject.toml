[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-moss"
version = "0.17.43"
description = "Multi-layer security analysis engine for AI agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "httpx>=0.25",
    "tomli>=2.0; python_version < '3.11'",
    "pydantic>=2.0",
    "tenacity>=8.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "pyyaml>=6.0",
]

[project.scripts]
agent-moss = "agent_moss.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["agent_moss*"]
# 测试用例不进交付物（2026-10 事故：wheel 混入 36 个测试文件）。顶层 tests/
# 不是包，但包内若出现 agent_moss/tests 会被 include 通配收进来，这里兜底排除。
exclude = ["agent_moss.tests*"]